<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #root { width: 100%; height: 100%; overflow: hidden; }
    #save-btn {
      position: fixed; top: 8px; right: 8px; z-index: 9999;
      background: #2c2a26; color: #fff; border: none;
      border-radius: 8px; padding: 6px 16px;
      font-size: 13px; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@excalidraw/excalidraw@0.17.6/dist/excalidraw.production.min.js"></script>
  <script>
    let api = null;
    const { Excalidraw } = ExcalidrawLib;
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(Excalidraw, {
      excalidrawAPI: (a) => { api = a; },
    }));

    let saveTimeout = null;
    const autoSave = () => {
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(() => {
        if (!api) return;
        window.parent.postMessage({
        type: 'SAVE_BOARD',
        elements: api.getSceneElements(),
        appState: api.getAppState(),
        files: api.getFiles(),
        }, '*');
    }, 1000);
    };

    const observer = new MutationObserver(autoSave);
    observer.observe(document.getElementById('root'), { childList: true, subtree: true });

    window.addEventListener('message', (e) => {
      if (e.data?.type === 'LOAD_BOARD' && api) {
        api.updateScene({ elements: e.data.elements || [] });
      }
    });

    document.getElementById('save-btn').addEventListener('click', () => {
      if (!api) return;
      window.parent.postMessage({
        type: 'SAVE_BOARD',
        elements: api.getSceneElements(),
        appState: api.getAppState(),
        files: api.getFiles(),
      }, '*');
    });
  </script>
</body>
</html>
